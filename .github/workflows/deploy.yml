name: Deploy twiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site
        run: yarn build

      - name: Derivative drift check (build-site-data reproducibility)
        run: |
          # prebuild(yarn build:site-data)가 docs/characters·static/site-data.json·intro.mdx fusion-toc을
          # 재생성함. 커밋된 산출물과 일치하지 않으면 drift → 실패.
          git diff --exit-code -- docs/characters static/site-data.json $(git ls-files 'docs/*/intro.mdx' 'docs/*/*/intro.mdx')

      - name: tdata.lock sanity check
        run: |
          test -f tdata.lock
          jq -e '.schema_version' tdata.lock

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
